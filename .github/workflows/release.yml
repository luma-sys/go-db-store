name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (ex: v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Validate branch and tag format
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Releases must be triggered from main (got ${{ github.ref }})"
            exit 1
          fi
          if [[ ! "${{ github.event.inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format. Expected vX.Y.Z (ex: v1.2.3)"
            exit 1
          fi

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ github.event.inputs.tag }}
          git push origin ${{ github.event.inputs.tag }}